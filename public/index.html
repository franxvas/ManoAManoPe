<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #ffffff;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Logo que se ve mientras descarga el código de la app; React lo reemplaza al arrancar. */
      #web-splash {
        display: flex;
        flex: 1;
        align-items: center;
        justify-content: center;
      }
      #web-splash img {
        width: 200px;
        height: 200px;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root">
      <div id="web-splash"><img src="/logo-mano-a-mano.png" alt="mano a mano punto pe" /></div>
    </div>
  </body>
</html>
